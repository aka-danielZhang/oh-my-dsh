name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    name: Desktop-owned plugins (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Upstream-line discipline: typecheck against the SAME baseline the
      # runtime pins (runtime/revision.json spells v<base>+zw.N; the upstream
      # tag is dsh-<base>). A floating master checkout silently moves the
      # goalposts every time upstream publishes.
      - name: Resolve harness baseline from runtime/revision.json
        id: baseline
        run: |
          # Upstream tags keep the leading v (dsh-v0.1.0-rc.8); stripping it
          # here fabricated dsh-0.1.0-rc.8 and checkout failed on fetch.
          ref=$(node -p "JSON.parse(require('fs').readFileSync('runtime/revision.json','utf8')).ref")
          base="${ref%+zw.*}"
          case "$base" in
            v*.*) echo "tag=dsh-$base" >> "$GITHUB_OUTPUT" ;;
            *) echo "runtime/revision.json carries no baseline: $ref"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.baseline.outputs.tag }}
          path: harness
      # No `version` input: package.json packageManager (pnpm 10.28) is the
      # single source of truth — pinning a different major here made
      # action-setup hard-error on the conflict (red since rc.3).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            harness/pnpm-lock.yaml
            plugin/**/pnpm-lock.yaml
      - name: Install harness
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Build harness (lib/types the plugin typechecks against)
        working-directory: harness
        run: pnpm run build
      - name: Check every shipped plugin
        env:
          DSH_CHECKOUT: ${{ github.workspace }}/harness
        run: node scripts/check-shipped-plugins.mjs

  shell:
    name: Electron shell (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck Electron shell
        run: pnpm desktop:typecheck
      - name: Test Electron shell
        run: pnpm desktop:test
      - name: Test shipped-plugin roster
        run: node --test scripts/shipped-plugins.test.mjs
      - name: Test release-notes extractor
        run: node --test scripts/release-notes.test.mjs
      - name: Test runtime npm publish script
        run: node --test scripts/publish-runtime-npm.test.mjs

  packaged-smoke:
    name: Packaged profile smoke (extract + import + dump-config)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            plugin/**/pnpm-lock.yaml
      - name: Cache runtime assembly
        uses: actions/cache@v4
        with:
          path: |
            runtime/src
            runtime/build
            runtime/tarballs
          key: runtime-${{ runner.os }}-${{ hashFiles('runtime/revision.json') }}-${{ hashFiles('scripts/prepare-runtime.mjs') }}
          restore-keys: |
            runtime-${{ runner.os }}-${{ hashFiles('runtime/revision.json') }}-
      - name: Install workspace and shipped plugins
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node scripts/shipped-plugins.mjs --print dir | while read -r dir; do
            pnpm --dir "$dir" install --frozen-lockfile || pnpm --dir "$dir" install --no-frozen-lockfile
          done
      - name: Assemble runtime
        run: node scripts/prepare-runtime.mjs
      - name: Packaged dump-config smoke
        run: pnpm run desktop:smoke
